  if (!ST.count) { send({ type: "notify", message: "Select a layer first" }); return; }
  if (v.type === "COLOR") { send({ type: "applyToken", variableId: v.id, target: "fill" }); return; }
  var target = DEFAULT_FIELD_FOR[v.type];
  if (!target) { send({ type: "notify", message: "Right-click to choose where this token applies" }); return; }
  send({ type: "applyToken", variableId: v.id, field: target });
}
var DEFAULT_FIELD_FOR = { FLOAT: "itemSpacing", STRING: "characters", BOOLEAN: "visible" };

function openTokenMenu(x, y, v) {
  var items;
  if (v.type === "COLOR") {
    items = [
      { label: "Bind to fill", run: function () { send({ type: "applyToken", variableId: v.id, target: "fill" }); } },
      { label: "Bind to stroke", run: function () { send({ type: "applyToken", variableId: v.id, target: "stroke" }); } }
    ];
  } else if (v.type === "FLOAT") {
    items = [
      { group: "Bind to" },
      { label: "Width", run: bindTo("width") }, { label: "Height", run: bindTo("height") },
      { label: "Gap", run: bindTo("itemSpacing") },
      { label: "Padding — top", run: bindTo("paddingTop") },
      { label: "Padding — right", run: bindTo("paddingRight") },
      { label: "Padding — bottom", run: bindTo("paddingBottom") },
      { label: "Padding — left", run: bindTo("paddingLeft") },
      { label: "Corner radius", run: bindTo("topLeftRadius") },
      { label: "Stroke weight", run: bindTo("strokeWeight") },
      { label: "Opacity", run: bindTo("opacity") },
      { label: "Font size", run: bindTo("fontSize") }
    ];
  } else if (v.type === "STRING") {
    items = [
      { label: "Bind to text content", run: bindTo("characters") },
      { label: "Bind to font family", run: bindTo("fontFamily") }
    ];
  } else {
    items = [{ label: "Bind to visibility", run: bindTo("visible") }];
  }
  function bindTo(f) { return function () { send({ type: "applyToken", variableId: v.id, field: f }); }; }
  menuAt(x, y, items);
}

/* =============================================================================
   Messages from the main thread
   ========================================================================== */

onmessage = function (event) {
  var msg = event.data && event.data.pluginMessage;
  if (!msg) return;

  switch (msg.type) {
    case "pages":
      ST.pages = msg.pages;
      ST.currentPageId = msg.currentPageId;
      var cur = null;
      ST.pages.forEach(function (p) { if (p.id === msg.currentPageId) cur = p; });
      $("page-btn").querySelector(".nm").textContent = cur ? cur.name : "Page";
      break;

    case "boot":
      bootStep(msg.step, msg.detail);
      break;

    case "layers":
      bootDone();
      ST.rows = msg.rows;
      ST.selIds = msg.selection || [];
      ST.truncated = msg.truncated;
      ST.searching = msg.searching;
      ST.pageName = msg.pageName;
      if (msg.zoom != null && Math.round(msg.zoom*100) !== Math.round((ST.zoom||0)*100)) { ST.zoom = msg.zoom; renderTabs(); }
      else if (msg.zoom != null) ST.zoom = msg.zoom;
      renderTree();
      scrollSelectionIntoView();
      break;

    case "props":
      ST.P = msg.props;
      ST.REFS = msg.refs || {};
      ST.count = msg.count || 0;
      ST.inspected = msg.inspected || 0;
      ST.types = msg.types || [];
      ST.colors = msg.colors;
      $("sel-badge").textContent = ST.count === 0 ? ""
        : (ST.count === 1 ? pretty(ST.P ? ST.P.type : "") : ST.count + " selected");
      // Text nodes need the font list for the weight dropdown.
      if (ST.P && ST.P.text) ensureFonts();
      if (ST.P && ST.P.variableModes && ST.modeCollections === null) {
        ST.modeCollections = "loading";
        send({ type: "getModeCollections" });
      }
      renderInspector();
      break;

    case "fonts":
      ST.fonts = msg.fonts;
      if (POP.refresh) POP.refresh(); else renderInspector();
      break;

    case "styles":
      ST.styles = msg;
      if (POP.refresh) POP.refresh(); else if (ST.tab === "tokens") renderInspector();
      break;

    case "variables":
      ST.variables = msg.collections;
      if (POP.refresh) POP.refresh(); else if (ST.tab === "tokens") renderInspector();
      break;

    case "libraryVariables":
      ST.libVariables = msg.collections;
      ST.libError = msg.teamLibraryError || null;
      if (POP.refresh) POP.refresh(); else if (ST.tab === "tokens") renderInspector();
      break;

    case "modeCollections":
      ST.modeCollections = msg.collections;
      renderInspector();
      break;

    case "reactions":
      ST.reactions = msg.reactions;
      if (ST.tab === "prototype") renderInspector();
      break;

    case "error":
      reportError("Plugin error: " + msg.message + (msg.stack ? "\n" + msg.stack : ""));
      break;

    case "prefs":
      if (msg.theme) applyTheme(msg.theme);
      break;

    case "libStatus":
      ST.lib = msg;
      if (ST.tab === "tokens") renderInspector();
      break;

    case "swapOptions":
      ST.swapOptions = { preferred: msg.preferred || [], local: msg.local || [] };
      if (POP.refresh) POP.refresh();
      break;

    case "exported":
      downloadFiles(msg.files);
      break;

    case "image":
      ST.images[msg.hash] = msg.bytes;
      break;
  }
};

function scrollSelectionIntoView() {
  if (ST.dragging || ST.renaming || !ST.selIds.length) return;
  var el = treeEl.querySelector(".lrow.sel");
  if (!el) return;
  var b = el.getBoundingClientRect(), t = treeEl.getBoundingClientRect();
  if (b.top < t.top || b.bottom > t.bottom) el.scrollIntoView({ block: "nearest", inline: "nearest" });
}

var MIME = { PNG: "image/png", JPG: "image/jpeg", SVG: "image/svg+xml", PDF: "application/pdf" };

function downloadFiles(files) {
  if (!files || !files.length) { send({ type: "notify", message: "Nothing was exported" }); return; }
  files.forEach(function (f, i) {
    setTimeout(function () {
      var blob = new Blob([f.bytes], { type: MIME[f.format] || "application/octet-stream" });
      var url = URL.createObjectURL(blob);
      var a = h("a", { href: url, download: f.name });
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    }, i * 120);
  });
}

/* =============================================================================
   Panel chrome: column splitter + window resize
   ========================================================================== */

(function () {
  var split = $("hsplit"), insp = $("inspector");
  split.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    split.setPointerCapture(e.pointerId);
    var startX = e.clientX, startW = insp.offsetWidth;
    function mv(ev) {
      var w = Math.max(120, Math.min(window.innerWidth - 120, startW - (ev.clientX - startX)));
      insp.style.flex = "0 1 " + Math.round(w) + "px";
    }
    function up() {
      split.releasePointerCapture(e.pointerId);
      split.removeEventListener("pointermove", mv);
      split.removeEventListener("pointerup", up);
    }
    split.addEventListener("pointermove", mv);
    split.addEventListener("pointerup", up);
  });
})();

(function () {
  var rz = $("resizer");
  rz.title = "Drag to resize the plugin window";
  rz.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    rz.setPointerCapture(e.pointerId);
    rz.classList.add("dragging");
    var x0 = e.clientX, y0 = e.clientY, w0 = window.innerWidth, h0 = window.innerHeight;
    function mv(ev) {
      send({ type: "resize", w: w0 + (ev.clientX - x0), h: h0 + (ev.clientY - y0) });
    }
    function up() {
      rz.classList.remove("dragging");
      rz.releasePointerCapture(e.pointerId);
      rz.removeEventListener("pointermove", mv);
      rz.removeEventListener("pointerup", up);
    }
    rz.addEventListener("pointermove", mv);
    rz.addEventListener("pointerup", up);
  });
})();

// The document keeps changing under us; make sure a stale popover reference
// never blocks rendering forever.
document.addEventListener("pointerdown", function (e) {
  if (POP.el && !POP.el.contains(e.target)) POP.refresh = null;
}, true);

/* =============================================================================
   Narrow mode — below this the paired controls stack instead of scrolling out
   of view sideways.
   ========================================================================== */

var NARROW_AT = 232;

function syncNarrow() {
  var insp = $("inspector");
  var narrow = insp.clientWidth > 0 && insp.clientWidth < NARROW_AT;
  insp.classList.toggle("narrow", narrow);
}

(function () {
  if (typeof ResizeObserver === "function") {
    new ResizeObserver(syncNarrow).observe($("inspector"));
  }
  window.addEventListener("resize", syncNarrow);
  syncNarrow();
})();

/* =============================================================================
   Boot
   ========================================================================== */

renderTabs();
renderInspector();
bootStep("Reading the page structure…");
send({ type: "ready" });
ensureVariables();
</script>
</body>
</html>
