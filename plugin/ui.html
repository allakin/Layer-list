<!DOCTYPE html>
<html data-theme="dark">
<head>
<meta charset="utf-8" />
<style>
/* ===========================================================================
   Figma UI3 surface tokens. Every colour comes from Figma's themeColors so the
   panel follows light / dark automatically.
   ======================================================================== */
:root[data-theme="auto"] {
  --bg:            var(--figma-color-bg, #fff);
  --bg-2:          var(--figma-color-bg-secondary, #f5f5f5);
  --bg-3:          var(--figma-color-bg-tertiary, #e6e6e6);
  --bg-hover:      var(--figma-color-bg-hover, rgba(0,0,0,.06));
  --bg-press:      var(--figma-color-bg-pressed, rgba(0,0,0,.1));
  --bg-sel:        var(--figma-color-bg-selected, #e5f0ff);
  --bg-sel-hover:  var(--figma-color-bg-selected-hover, #d6e8ff);
  --bg-sel-strong: var(--figma-color-bg-selected-strong, #0d99ff);
  --bg-sub:        var(--figma-color-bg-selected-tertiary, rgba(13,153,255,.06));
  --brand:         var(--figma-color-bg-brand, #0d99ff);
  --brand-hover:   var(--figma-color-bg-brand-hover, #007be5);
  --danger:        var(--figma-color-bg-danger, #f24822);
  --text:          var(--figma-color-text, #000);
  --text-2:        var(--figma-color-text-secondary, rgba(0,0,0,.5));
  --text-3:        var(--figma-color-text-tertiary, rgba(0,0,0,.3));
  --text-onbrand:  var(--figma-color-text-onbrand, #fff);
  --text-comp:     var(--figma-color-text-component, #8638e5);
  --text-slot:     var(--figma-color-text-slot, #d9480f);
  --text-danger:   var(--figma-color-text-danger, #f24822);
  --icon:          var(--figma-color-icon, rgba(0,0,0,.8));
  --icon-2:        var(--figma-color-icon-secondary, rgba(0,0,0,.5));
  --border:        var(--figma-color-border, rgba(0,0,0,.1));
  --border-strong: var(--figma-color-border-strong, rgba(0,0,0,.2));
  --border-sel:    var(--figma-color-border-selected, #0d99ff);
}

:root {
  --row: 24px;          /* layer row height          */
  --ctl: 24px;          /* small control height      */
  --fld: 32px;          /* design-panel field height */
  --pad: 8px;
  --r:   5px;
}

/* Dark is the default. It does not derive from Figma's theme variables at all —
   a cooler, darker surface with its own accent, so the panel never reads as part
   of Figma's chrome. */
:root[data-theme="dark"] {
  --bg:            #17181c;
  --bg-2:          #21232a;
  --bg-3:          #2f323b;
  --bg-hover:      rgba(255,255,255,.06);
  --bg-press:      rgba(255,255,255,.11);
  --bg-sel:        #1d3550;
  --bg-sel-hover:  #24425f;
  --bg-sel-strong: #4a8cff;
  --bg-sub:        rgba(74,140,255,.09);
  --brand:         #4a8cff;
  --brand-hover:   #6ba0ff;
  --danger:        #c8342b;
  --text:          #e6e7ea;
  --text-2:        rgba(230,231,234,.60);
  --text-3:        rgba(230,231,234,.36);
  --text-onbrand:  #0d1117;
  --text-comp:     #b98cff;
  --text-slot:     #ff9351;
  --text-danger:   #ff7b72;
  --icon:          rgba(230,231,234,.86);
  --icon-2:        rgba(230,231,234,.55);
  --border:        rgba(255,255,255,.09);
  --border-strong: rgba(255,255,255,.20);
  --border-sel:    #4a8cff;
}

/* On a dark surface the selected segment has to come forward, not recede. */
[data-theme="dark"] .seg-b.on {
  background: var(--bg-3); box-shadow: none; color: var(--text);
}
[data-theme="dark"] .fld:focus-within { background: var(--bg-2); }
[data-theme="dark"] .pop {
  box-shadow: 0 8px 28px rgba(0,0,0,.55), 0 0 0 1px var(--border-strong);
}
[data-theme="dark"] .tgl i { background: #e6e7ea; }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  font: 400 11px/16px Inter, "SF Pro Text", -apple-system, BlinkMacSystemFont, sans-serif;
  letter-spacing: .005em;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  user-select: none;
}
input, select, button, textarea { font: inherit; letter-spacing: inherit; }
svg { display: block; width: 16px; height: 16px; flex: 0 0 auto; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border: 3px solid transparent; background-clip: content-box; border-radius: 6px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-3); background-clip: content-box; }

#app { display: flex; flex-direction: column; height: 100vh; }

/* ---- generic icon button ------------------------------------------------- */
.ib {
  height: var(--ctl); min-width: var(--ctl); padding: 0 4px;
  display: inline-flex; align-items: center; justify-content: center;
  border: none; background: none; color: var(--icon-2);
  border-radius: var(--r); cursor: default;
}
.ib:hover { background: var(--bg-hover); color: var(--icon); }
.ib:active { background: var(--bg-press); }
.ib.on { background: var(--bg-sel); color: var(--brand); }
.ib.on:hover { background: var(--bg-sel-hover); }
.ib.plain.on { background: none; color: var(--icon); }
/* "a style is applied here" — a bare blue glyph, no pill behind it */
.ib.brand, .ib.brand.on { background: none; color: var(--brand); }
.ib.brand:hover { background: var(--bg-hover); }
.ib[disabled] { opacity: .3; pointer-events: none; }

/* ---- top bar: pages ----------------------------------------------------- */
#topbar {
  flex: 0 0 auto; height: 40px; display: flex; align-items: center; gap: 2px;
  padding: 0 var(--pad); border-bottom: 1px solid var(--border);
}
#page-btn {
  display: flex; align-items: center; gap: 6px; height: var(--fld);
  padding: 0 6px; border: none; background: none; color: var(--text);
  border-radius: var(--r); cursor: default; max-width: 60%;
}
#page-btn:hover { background: var(--bg-hover); }
#page-btn .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#topbar .sp { flex: 1; }
#sel-badge { color: var(--text-2); padding: 0 6px; white-space: nowrap; }

/* ---- main split --------------------------------------------------------- */
#main { flex: 1 1 auto; display: flex; min-height: 0; }
/* Zero basis, not `auto`: rows are as wide as their content, so with an `auto`
   basis one very long name — or one deep branch — made this pane's ideal width
   thousands of pixels and the inspector, which may shrink, collapsed to nothing.
   The tree scrolls sideways inside the pane instead. */
#layers-pane { flex: 1 1 0; min-width: 100px; display: flex; flex-direction: column; min-height: 0; }
#hsplit { flex: 0 0 auto; width: 1px; background: var(--border); cursor: col-resize; position: relative; }
#hsplit::after { content: ""; position: absolute; inset: 0 -3px; }
#hsplit:hover { background: var(--brand); }
#inspector { flex: 0 1 264px; min-width: 0; display: flex; flex-direction: column; min-height: 0; }

/* ---- layers toolbar ----------------------------------------------------- */
#layers-toolbar {
  flex: 0 0 auto; display: flex; align-items: center; gap: 2px;
  padding: 6px var(--pad); border-bottom: 1px solid var(--border);
}
.searchbox {
  flex: 1; display: flex; align-items: center; gap: 4px; height: var(--ctl);
  padding: 0 6px; border-radius: var(--r); background: var(--bg-2); color: var(--text-2);
}
.searchbox:focus-within { background: var(--bg); box-shadow: inset 0 0 0 1px var(--border-sel); }
.searchbox input { flex: 1; min-width: 0; border: none; background: none; outline: none; color: var(--text); }
.searchbox input::placeholder { color: var(--text-3); }

/* ---- layer tree --------------------------------------------------------- */
#tree { flex: 1 1 auto; overflow: auto; padding-bottom: 24px; position: relative; }
/* Rows size to their content so long names and deep nesting scroll sideways
   instead of being clipped; the action buttons stay pinned to the right edge. */
.lrow {
  display: flex; align-items: center; height: var(--row);
  position: relative; white-space: nowrap; cursor: default;
  width: max-content; min-width: 100%;
}
/* order matters: the subtree wash must lose to hover and to the selection */
.lrow.sub { background: var(--bg-sub); }
.lrow:hover { background: var(--bg-hover); }
.lrow.sel { background: var(--bg-sel); }
.lrow.sel:hover { background: var(--bg-sel-hover); }
.lrow.cut { opacity: .4; }
.lrow .caret {
  width: 16px; height: var(--row); flex: 0 0 auto; display: inline-flex;
  align-items: center; justify-content: center; color: var(--icon-2);
}
.lrow .caret svg { width: 12px; height: 12px; }
.lrow .caret.none { visibility: hidden; }
.lrow .tico { width: 20px; height: var(--row); flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; color: var(--icon-2); }
.lrow.comp .tico, .lrow.comp .nm { color: var(--text-comp); }
/* a slot keeps its own colour even when it sits inside a component */
.lrow.slot .tico, .lrow.slot .nm { color: var(--text-slot); }
.lrow .nm { flex: 0 0 auto; padding-right: 8px; }
.lrow .path { color: var(--text-3); padding-right: 8px; flex: 0 0 auto; }
.lrow.off .nm, .lrow.off .tico { opacity: .4; }
.lrow .badge { color: var(--text-3); padding-right: 6px; }
.lrow .acts {
  position: sticky; right: 0; margin-left: auto; flex: 0 0 auto;
  display: flex; align-items: center; gap: 0;
  /* No padding while nothing is showing, so the strip collapses to zero width
     and the layer name gets the whole row. */
  padding: 0;
  /* opaque base + the row's own translucent state layer, so names scroll under
     the buttons without the colours doubling up */
  background-color: var(--bg);
}
.lrow:hover .acts, .lrow.has-stick .acts { padding: 0 4px 0 16px; }
.lrow.sub .acts { background-image: linear-gradient(var(--bg-sub), var(--bg-sub)); }
.lrow:hover .acts { background-image: linear-gradient(var(--bg-hover), var(--bg-hover)); }
.lrow.sel .acts { background-image: linear-gradient(var(--bg-sel), var(--bg-sel)); }
.lrow.sel:hover .acts { background-image: linear-gradient(var(--bg-sel-hover), var(--bg-sel-hover)); }
/* display, not opacity — a transparent button still reserves its width */
.lrow .acts .ib { display: none; height: 20px; min-width: 20px; }
.lrow:hover .acts .ib, .lrow .acts .ib.stick { display: inline-flex; }
.lrow .rn {
  flex: 0 0 auto; width: 170px; height: 18px; border: none; outline: none;
  background: var(--bg); color: var(--text); border-radius: 3px;
  box-shadow: 0 0 0 1px var(--border-sel); padding: 0 3px; margin-right: 8px;
}
#drop-line { position: absolute; height: 2px; background: var(--brand); pointer-events: none; z-index: 5; border-radius: 1px; }
#drop-box  { position: absolute; box-shadow: inset 0 0 0 2px var(--brand); pointer-events: none; z-index: 5; border-radius: 2px; }
.tree-note { padding: 6px var(--pad); color: var(--text-3); }

/* ---- inspector tabs ----------------------------------------------------- */
#tabs {
  flex: 0 0 auto; display: flex; align-items: center; gap: 2px;
  padding: 6px var(--pad); border-bottom: 1px solid var(--border);
}
/* UI3 renders the active tab as a filled chip, not an underline */
.tab {
  height: 26px; padding: 0 10px; border: none; background: none; cursor: default;
  color: var(--text-2); border-radius: 6px; white-space: nowrap;
}
.tab:hover { color: var(--text); background: var(--bg-hover); }
.tab.on { color: var(--text); background: var(--bg-2); font-weight: 600; }
#zoom-btn { margin-left: auto; }

#insp-body { flex: 1 1 auto; overflow: auto; padding-bottom: 40px; }
#insp-empty { padding: 24px var(--pad); color: var(--text-3); text-align: center; }

/* ---- inspector sections ------------------------------------------------- */
/* min-width keeps the controls usable when the panel is squeezed — the body
   scrolls sideways instead of collapsing them into unreadable slivers */
.sec { border-bottom: 1px solid var(--border); padding: 10px var(--pad) 12px; min-width: 224px; }
.sec.tight { padding-top: 6px; padding-bottom: 6px; }
.sec.empty { padding-top: 6px; padding-bottom: 6px; }
.sec.empty .sec-hd { margin: 0; }
.sec.empty .sec-hd .t { color: var(--text-2); font-weight: 400; }
.sec-hd { display: flex; align-items: center; height: var(--ctl); margin-bottom: 8px; }
.sec-hd .t { font-weight: 600; font-size: 12px; flex: 1; }
.sec-hd .acts { display: flex; align-items: center; gap: 0; flex: 0 0 auto; }
.lbl { color: var(--text-2); margin: 0 0 4px; }
.grp { margin-bottom: 10px; }
.grp:last-child { margin-bottom: 0; }
.hint { color: var(--text-3); padding: 2px 0 4px; }
.empty-line { color: var(--text-3); height: var(--fld); display: flex; align-items: center; }

/* Two controls that belong together, each with its own label. Side by side at
   normal width, stacked once the panel is too narrow to hold both. */
.pair { display: flex; gap: var(--pad); min-width: 0; }
.pair > .cell { flex: 1 1 0; min-width: 0; }
.pair > .cell > .lbl { margin: 0 0 4px; }

#inspector.narrow .sec { min-width: 0; }
#inspector.narrow .pair { flex-direction: column; }
#inspector.narrow .r.g2 { flex-direction: column; align-items: stretch; }
#inspector.narrow .r.g2 > * { flex: 0 0 auto; }

.r  { display: flex; align-items: center; gap: var(--pad); margin-bottom: var(--pad); }
.r:last-child { margin-bottom: 0; }
/* fields and dropdowns share the row evenly; icon buttons stay their own size */
.r > .fld, .r > .sel, .r > .seg, .r.g2 > * { flex: 1 1 0; min-width: 0; }
.r > .ib, .r.g2 > .ib, .r > .padgrid { flex: 0 0 auto; }
.r.tightgap { gap: 4px; }
.grow { flex: 1 1 auto; min-width: 0; }

/* ---- field (number / text with leading icon) ---------------------------- */
/* UI3 property inputs sit on a filled grey plate; reference fields (a style or
   font applied to the layer) are white with a hairline instead. */
.fld {
  display: flex; align-items: center; height: var(--fld); min-width: 0;
  border-radius: var(--r); background: var(--bg-2);
  box-shadow: inset 0 0 0 1px transparent; position: relative;
}
.fld:hover { box-shadow: inset 0 0 0 1px var(--border-strong); }
.fld:focus-within { box-shadow: inset 0 0 0 1px var(--border-sel); background: var(--bg); }
.fld.boxed { box-shadow: inset 0 0 0 1px var(--border); }
.fld.ref { background: var(--bg); box-shadow: inset 0 0 0 1px var(--border); }
.fld.ref:hover { box-shadow: inset 0 0 0 1px var(--border-strong); }
.fld .mode { color: var(--text); padding-right: 8px; flex: 0 0 auto; }
.fld .refname { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 6px; }
.fld .refsub { color: var(--text-3); flex: 0 0 auto; padding-right: 8px; }
.fld > .k {
  width: 20px; height: 100%; flex: 0 0 auto; display: inline-flex;
  align-items: center; justify-content: center; color: var(--icon-2);
  cursor: ew-resize; font-size: 10px;
}
.fld > .k svg { width: 14px; height: 14px; }
.fld > .k.noscrub { cursor: default; }
.fld input {
  flex: 1 1 auto; min-width: 0; height: 100%; border: none; outline: none;
  background: none; color: var(--text); padding: 0 4px 0 0;
}
.fld input::placeholder { color: var(--text-3); }
.fld .unit { color: var(--text-3); padding-right: 6px; flex: 0 0 auto; }
.fld .tail { display: flex; align-items: center; padding-right: 2px; flex: 0 0 auto; }
/* Hover-only buttons are removed from the flow rather than just made
   transparent — otherwise they reserve width and clip the value. */
.fld .tail .ib { display: none; height: 20px; min-width: 20px; }
.fld .tail .ib.stick { display: inline-flex; }
.fld:hover .tail .ib, .fld:focus-within .tail .ib { display: inline-flex; }
/* A read-only field drops the filled plate for a hairline, so "you can't type
   here" is legible at a glance. Fields that still carry an interactive mode
   label (W / H with Fill / Hug) keep the plate. */
.fld.dis { background: none; box-shadow: inset 0 0 0 1px var(--border); }
.fld.dis:hover { box-shadow: inset 0 0 0 1px var(--border); }
.fld.dis input, .fld.dis > .k { color: var(--text-3); pointer-events: none; }
.fld.dis.plate { background: var(--bg-2); box-shadow: inset 0 0 0 1px transparent; }
.fld.dis.plate:hover { box-shadow: inset 0 0 0 1px var(--border-strong); }

/* token-bound field: the value is replaced by the token chip, like Figma */
.fld.tok { box-shadow: none; background: var(--bg-sel); }
.fld.tok:hover { background: var(--bg-sel-hover); }
.fld.tok > .k { color: var(--brand); cursor: default; }
.fld.tok .tk { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); padding-right: 4px; }

/* ---- segmented control -------------------------------------------------- */
.seg { display: flex; align-items: center; gap: 2px; padding: 2px; border-radius: 6px; background: var(--bg-2); }
.seg.flat { background: none; padding: 0; }
.seg-b {
  flex: 1 1 0; height: 24px; min-width: 24px; border: none; background: none;
  color: var(--icon-2); border-radius: 4px; cursor: default;
  display: inline-flex; align-items: center; justify-content: center;
}
.seg-b:hover { color: var(--icon); background: var(--bg-hover); }
.seg-b.on { background: var(--bg); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.seg.flat .seg-b.on { background: var(--bg-sel); color: var(--brand); box-shadow: none; }
.seg-b[disabled] { opacity: .3; pointer-events: none; }

/* ---- select (custom dropdown) ------------------------------------------- */
.sel {
  display: flex; align-items: center; gap: 4px; height: var(--fld); min-width: 0;
  padding: 0 4px 0 6px; border: none; background: none; color: var(--text);
  border-radius: var(--r); box-shadow: inset 0 0 0 1px transparent; cursor: default;
}
.sel:hover { box-shadow: inset 0 0 0 1px var(--border-strong); }
.sel.open { box-shadow: inset 0 0 0 1px var(--border-sel); }
.sel .v { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sel .v.mix { color: var(--text-3); }
.sel svg { color: var(--icon-2); width: 14px; height: 14px; }
.sel.boxed { box-shadow: inset 0 0 0 1px var(--border); }

/* ---- checkbox row ------------------------------------------------------- */
.chk { display: flex; align-items: center; gap: 6px; height: var(--ctl); cursor: default; }
.chk .box {
  width: 12px; height: 12px; border-radius: 2px; flex: 0 0 auto;
  box-shadow: inset 0 0 0 1px var(--border-strong); display: inline-flex;
  align-items: center; justify-content: center; color: var(--text-onbrand);
}
.chk .box.on { background: var(--brand); box-shadow: none; }
.chk .box svg { width: 10px; height: 10px; }
.chk:hover .box { box-shadow: inset 0 0 0 1px var(--text-2); }
.chk .box.on:hover { background: var(--brand-hover); box-shadow: none; }

/* ---- component property rows -------------------------------------------- */
.prop { display: flex; align-items: center; gap: var(--pad); min-height: var(--fld); }
.prop .plabel {
  flex: 0 0 84px; min-width: 0; color: var(--text-2);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.prop .pctl { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; }
.prop .pctl > * { flex: 1 1 auto; min-width: 0; }
.prop .pctl > .tgl { flex: 0 0 auto; }
/* a property forwarded from a nested instance */
.prop.nested .plabel { padding-left: 0; }
.prop .arrow { color: var(--text-3); flex: 0 0 auto; margin-right: 4px; }
.prop .plabel { display: flex; align-items: center; }

/* Figma switches booleans with a pill toggle, not a checkbox */
.tgl {
  width: 28px; height: 16px; border-radius: 8px; background: var(--bg-3);
  position: relative; cursor: default; transition: background .12s ease;
}
.tgl:hover { background: var(--border-strong); }
.tgl.on, .tgl.on:hover { background: var(--brand); }
.tgl.mix { background: linear-gradient(90deg, var(--brand) 50%, var(--bg-3) 50%); }
.tgl i {
  position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .12s ease;
}
.tgl.on i { transform: translateX(12px); }

/* instance header: component title, set / library line, description */
.comp-head { display: flex; align-items: center; gap: 4px; min-width: 0; }
.comp-head .t {
  font-weight: 600; font-size: 12px; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.comp-sub { display: flex; align-items: center; gap: 4px; color: var(--text-2); margin-top: 2px; }
.comp-sub svg { width: 12px; height: 12px; }
.comp-sub .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.comp-desc {
  color: var(--text); margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 3;
  -webkit-box-orient: vertical; overflow: hidden;
}
.comp-desc.open { -webkit-line-clamp: unset; }

/* ---- paint / effect rows ------------------------------------------------ */
.prow { display: flex; align-items: center; gap: 4px; margin-bottom: 4px; }
.prow:last-child { margin-bottom: 0; }
.sw {
  width: 24px; height: 24px; flex: 0 0 auto; border-radius: 4px;
  box-shadow: inset 0 0 0 1px var(--border); cursor: default; position: relative;
  overflow: hidden; background-size: 8px 8px;
  background-image:
    linear-gradient(45deg, var(--bg-3) 25%, transparent 25%, transparent 75%, var(--bg-3) 75%),
    linear-gradient(45deg, var(--bg-3) 25%, transparent 25%, transparent 75%, var(--bg-3) 75%);
  background-position: 0 0, 4px 4px;
}
.sw i { position: absolute; inset: 0; display: block; }
.sw.sm { width: 16px; height: 16px; border-radius: 3px; }
.prow .body { flex: 1 1 auto; display: flex; align-items: center; min-width: 0; }
.prow .hexf { flex: 1 1 auto; min-width: 40px; }
.prow .opf  { flex: 0 0 54px; }
.prow .tools { display: flex; align-items: center; flex: 0 0 auto; }
/* blend / visibility only appear on hover, and until then they take no room —
   otherwise the hex and opacity fields lose ~48px for nothing */
.prow .tools .ib { display: none; }
.prow:hover .tools .ib, .prow .tools .ib.stick { display: inline-flex; }
.mono { font-variant-numeric: tabular-nums; }

/* style / token chip on a section header */
.chip {
  display: inline-flex; align-items: center; gap: 4px; height: 24px;
  padding: 0 4px 0 4px; border-radius: 4px; background: var(--bg-sel);
  color: var(--text); max-width: 100%; min-width: 0;
}
.chip .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip svg { width: 12px; height: 12px; color: var(--brand); }
.chip .x { color: var(--icon-2); }

/* ---- 3x3 auto-layout alignment pad -------------------------------------- */
.padgrid {
  width: 72px; height: 72px; flex: 0 0 auto; display: grid;
  grid-template: repeat(3, 1fr) / repeat(3, 1fr);
  border-radius: var(--r); box-shadow: inset 0 0 0 1px var(--border); overflow: hidden;
}
.padgrid .c { display: flex; align-items: center; justify-content: center; cursor: default; }
.padgrid .c:hover .d { background: var(--text-3); }
.padgrid .c .d { width: 4px; height: 4px; border-radius: 1px; background: var(--border-strong); }
.padgrid .c.on .d { background: var(--brand); width: 6px; height: 6px; }
.padgrid.dis { opacity: .35; pointer-events: none; }

/* ---- popovers ----------------------------------------------------------- */
#pop-layer { position: fixed; inset: 0; z-index: 100; display: none; }
#pop-layer.on { display: block; }
.pop {
  position: absolute; background: var(--bg); border-radius: 8px;
  box-shadow: 0 2px 14px rgba(0,0,0,.15), 0 0 0 .5px var(--border-strong);
  overflow: hidden; display: flex; flex-direction: column; max-height: 80vh;
}
.pop-hd { display: flex; align-items: center; gap: 4px; padding: 6px 6px 6px 10px; flex: 0 0 auto; }
.pop-hd .t { flex: 1; font-weight: 600; }
.pop-body { overflow: auto; padding: 4px; flex: 1 1 auto; }
.menu { min-width: 150px; }
.mi {
  display: flex; align-items: center; gap: 8px; height: 26px; padding: 0 8px 0 6px;
  border-radius: 4px; cursor: default; color: var(--text); white-space: nowrap;
}
.mi:hover { background: var(--brand); color: var(--text-onbrand); }
.mi:hover .kbd, .mi:hover .sub { color: var(--text-onbrand); opacity: .7; }
.mi .tick { width: 12px; flex: 0 0 auto; display: inline-flex; }
.mi .tick svg { width: 12px; height: 12px; }
.mi-icon { flex: 0 0 auto; display: inline-flex; align-items: center; color: var(--icon); }
.mi-icon svg { width: 16px; height: 16px; }
.mi:hover .mi-icon { color: var(--text-onbrand); }
.sel .mi-icon { color: var(--icon-2); }
.mi .t { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.mi .kbd { color: var(--text-3); }
.mi .sub { color: var(--text-3); }
.mi.dis { color: var(--text-3); pointer-events: none; }
.mi.danger:hover { background: var(--danger); }
.msep { height: 1px; background: var(--border); margin: 4px 6px; }
.mgroup { padding: 8px 8px 2px; color: var(--text-3); font-weight: 600; }

/* ---- colour picker ------------------------------------------------------ */
.cp { width: 240px; }
.cp .tabs { display: flex; gap: 2px; padding: 0 6px 6px; }
.cp .tabs .seg { flex: 1; }
.sv {
  position: relative; height: 160px; cursor: crosshair;
  background-image:
    linear-gradient(to top, #000, transparent),
    linear-gradient(to right, #fff, transparent);
}
.sv .knob {
  position: absolute; width: 12px; height: 12px; border-radius: 50%;
  box-shadow: 0 0 0 1.5px #fff, 0 0 3px rgba(0,0,0,.5);
  transform: translate(-6px, -6px); pointer-events: none;
}
.cp-sliders { padding: 8px; display: flex; align-items: center; gap: 8px; }
.cp-sliders .stack { flex: 1; display: flex; flex-direction: column; gap: 8px; }
.slid { position: relative; height: 10px; border-radius: 5px; cursor: default; }
.slid.hue { background: linear-gradient(to right, #f00 0%, #ff0 17%, #0f0 33%, #0ff 50%, #00f 67%, #f0f 83%, #f00 100%); }
.slid.alpha { background-size: 8px 8px; background-image:
    linear-gradient(45deg, var(--bg-3) 25%, transparent 25%, transparent 75%, var(--bg-3) 75%),
    linear-gradient(45deg, var(--bg-3) 25%, transparent 25%, transparent 75%, var(--bg-3) 75%);
  background-position: 0 0, 4px 4px; }
.slid .track { position: absolute; inset: 0; border-radius: 5px; }
.slid .knob {
  position: absolute; top: -1px; width: 12px; height: 12px; border-radius: 50%;
  background: #fff; box-shadow: 0 0 0 .5px rgba(0,0,0,.3), 0 1px 3px rgba(0,0,0,.3);
  transform: translateX(-6px); pointer-events: none;
}
.cp-preview { width: 32px; height: 32px; border-radius: 4px; box-shadow: inset 0 0 0 1px var(--border); position: relative; overflow: hidden;
  background-size: 8px 8px; background-image:
    linear-gradient(45deg, var(--bg-3) 25%, transparent 25%, transparent 75%, var(--bg-3) 75%),
    linear-gradient(45deg, var(--bg-3) 25%, transparent 25%, transparent 75%, var(--bg-3) 75%);
  background-position: 0 0, 4px 4px; }
.cp-preview i { position: absolute; inset: 0; }
.cp-fields { display: flex; align-items: center; gap: 4px; padding: 0 8px 8px; }
.cp-sec { border-top: 1px solid var(--border); padding: 6px 8px 8px; }
.cp-sec .h { display: flex; align-items: center; gap: 4px; color: var(--text-2); margin-bottom: 4px; }
.cp-sec .h .t { flex: 1; font-weight: 600; color: var(--text); }
.swatches { display: flex; flex-wrap: wrap; gap: 4px; }
.tok-list { max-height: 168px; overflow: auto; }
.tok-row {
  display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 4px;
  border-radius: 4px; cursor: default; min-width: 0;
}
.tok-row:hover { background: var(--bg-hover); }
.tok-row.on { background: var(--bg-sel); }
.tok-row .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tok-row .val { color: var(--text-3); flex: 0 0 auto; }
.gstrip { position: relative; height: 24px; margin: 0 8px 8px; border-radius: 4px; box-shadow: inset 0 0 0 1px var(--border); }
.gstrip .gs {
  position: absolute; top: -3px; width: 10px; height: 30px; margin-left: -5px;
  border-radius: 3px; box-shadow: 0 0 0 1.5px #fff, 0 0 4px rgba(0,0,0,.45);
}
.gstrip .gs.on { box-shadow: 0 0 0 2px var(--brand), 0 0 4px rgba(0,0,0,.45); }

.libstat {
  display: flex; align-items: center; gap: 6px; color: var(--text-2);
  padding: 6px var(--pad); border-bottom: 1px solid var(--border);
}
.libstat .dot { width: 6px; height: 6px; border-radius: 50%; background: #14ae5c; flex: 0 0 auto; }
.libstat.busy .dot { background: var(--brand); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .3 } }
.libstat .n { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.libstat .when { color: var(--text-3); flex: 0 0 auto; }

/* ---- token browser tab -------------------------------------------------- */
.tb-col { border-bottom: 1px solid var(--border); }
.tb-col-hd { display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 var(--pad); cursor: default; }
.tb-col-hd:hover { background: var(--bg-hover); }
.tb-col-hd .t { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.tb-col-hd .n { color: var(--text-3); }
.tb-group { padding: 6px var(--pad) 2px; color: var(--text-3); font-weight: 600; }
.tb-row {
  display: flex; align-items: center; gap: 6px; height: var(--row);
  padding: 0 var(--pad); cursor: default; min-width: 0;
}
.tb-row:hover { background: var(--bg-hover); }
.tb-row .nm { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tb-row .val { color: var(--text-2); flex: 0 0 auto; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tb-row .alias { color: var(--text-comp); }

/* ---- misc --------------------------------------------------------------- */
/* The resize grip. It used to be a hairline corner at 36% opacity, which on a
   dark panel reads as nothing at all. Now it is the familiar diagonal grip, big
   enough to aim at, and it brightens on hover and while you drag. */
#resizer {
  position: fixed; right: 0; bottom: 0; width: 22px; height: 22px;
  cursor: nwse-resize; z-index: 90; color: var(--text-2);
  border-bottom-right-radius: 4px;
}
#resizer::before {
  content: ""; position: absolute; inset: 2px;
  border-radius: 4px; background: transparent; transition: background .12s ease;
}
#resizer::after {
  content: ""; position: absolute; right: 3px; bottom: 3px; width: 14px; height: 14px;
  background: repeating-linear-gradient(
    -45deg,
    currentColor 0 1.6px,
    transparent 1.6px 4.4px
  );
  /* keep only the corner triangle, so it reads as a grip and not as hatching */
  -webkit-mask-image: linear-gradient(to top left, #000 58%, transparent 58%);
  mask-image: linear-gradient(to top left, #000 58%, transparent 58%);
}
#resizer:hover { color: var(--text); }
#resizer:hover::before { background: var(--bg-hover); }
#resizer.dragging { color: var(--brand); }
#resizer.dragging::before { background: var(--bg-sel); }
/* Reading a large page is not instant, so say what is happening instead of
   showing an empty panel. */
#boot {
  position: fixed; inset: 0; z-index: 200; display: flex;
  align-items: center; justify-content: center; background: var(--bg);
}
#boot.gone { display: none; }
.boot-card { width: 210px; text-align: center; }
.boot-title { font-weight: 600; font-size: 12px; margin-bottom: 10px; }
.boot-step { color: var(--text-2); margin-bottom: 10px; min-height: 16px; }
.boot-bar { height: 3px; border-radius: 2px; background: var(--bg-2); overflow: hidden; }
.boot-bar i {
  display: block; width: 40%; height: 100%; border-radius: 2px;
  background: var(--brand); animation: boot-slide 1.1s ease-in-out infinite;
}
@keyframes boot-slide {
  0%   { transform: translateX(-100%); }
  100% { transform: translateX(250%); }
}
.boot-hint { color: var(--text-3); margin-top: 10px; min-height: 16px; }

#errbar {
  display: none; align-items: flex-start; gap: 6px; flex: 0 0 auto;
  background: var(--danger); color: #fff; padding: 6px 6px 6px 8px;
}
#errbar .eb-msg { flex: 1 1 auto; min-width: 0; white-space: pre-wrap; word-break: break-word; max-height: 92px; overflow: auto; }
#errbar .eb-btn {
  flex: 0 0 auto; border: none; background: rgba(255,255,255,.2); color: #fff;
  border-radius: 4px; height: 20px; padding: 0 7px; cursor: default;
}
#errbar .eb-btn:hover { background: rgba(255,255,255,.32); }
.nowrap { white-space: nowrap; }

  close.className = "eb-btn";
  close.textContent = "✕";

function ic(inner, filled) {

/* =============================================================================
   Popover layer — one at a time, anchored, dismissed on outside click / Esc.
   While a popover is open the inspector defers re-rendering so live document
   changes never yank the control out from under the pointer.
   ========================================================================== */

var POP = { el: null, onClose: null };

function popOpen(anchor, node, opts) {
  popClose();
  var o = opts || {};
  var layer = $("pop-layer");
  layer.classList.add("on");
  var pop = h("div", { class: "pop " + (o.class || ""), onmousedown: stop, onclick: stop });
  pop.appendChild(node);
  layer.appendChild(pop);

  // A missing or detached anchor must not take the panel down with it — fall
  // back to the middle of the window.
  var r = anchor && typeof anchor.getBoundingClientRect === "function"
    ? anchor.getBoundingClientRect()
    : { left: window.innerWidth / 2, right: window.innerWidth / 2,
        top: window.innerHeight / 3, bottom: window.innerHeight / 3 };
  var w = o.width || pop.offsetWidth || 200;
  pop.style.width = o.width ? o.width + "px" : "";
  var pw = pop.offsetWidth, ph = pop.offsetHeight;
  var left = o.align === "right" ? r.right - pw : r.left;
  left = Math.max(4, Math.min(left, window.innerWidth - pw - 4));
  var top = r.bottom + 4;
  if (top + ph > window.innerHeight - 4) top = Math.max(4, r.top - ph - 4);
  pop.style.left = Math.round(left) + "px";
  pop.style.top = Math.round(top) + "px";

  POP.onClose = o.onClose || null;
  if (o.focus) { var f = pop.querySelector("input"); if (f) { f.focus(); f.select(); } }

}

  var layer = $("pop-layer");

$("pop-layer").addEventListener("mousedown", popClose);
$("pop-layer").addEventListener("contextmenu", function (e) { e.preventDefault(); popClose(); });
document.addEventListener("keydown", function (e) {

// items: {label, kbd, sub, on, disabled, danger, run} | "-" | {group:"Title"}
function menu(anchor, items, opts) {
  var body = h("div", { class: "pop-body menu" });
  items.forEach(function (it) {
    if (it === "-") { body.appendChild(h("div", { class: "msep" })); return; }
    if (it.group) { body.appendChild(h("div", { class: "mgroup", text: it.group })); return; }
    var row = h("div", {
      class: "mi" + (it.disabled ? " dis" : "") + (it.danger ? " danger" : ""),
      onclick: function () { popClose(); if (it.run) it.run(); }
    }, [
      opts && opts.noTicks ? null : h("span", { class: "tick", html: it.on ? I.tick : "" }),
      it.color ? h("span", { class: "sw sm", style: "background:" + it.color }) : null,
      it.icon ? h("span", { class: "mi-icon", html: it.icon }) : null,
      h("span", { class: "t", text: it.label }),
      it.sub ? h("span", { class: "sub", text: it.sub }) : null,
      it.kbd ? h("span", { class: "kbd", text: it.kbd }) : null
    ]);
    body.appendChild(row);
  });
  return popOpen(anchor, body, { width: opts && opts.width, align: opts && opts.align });
}

  var fake = { getBoundingClientRect: function () { return { left: x, right: x, top: y, bottom: y }; } };

  var want = o.bindType || TYPE_FOR_FIELD[firstField] || "FLOAT";
  var query = "";

  function build() {
    var body = h("div", { class: "pop-body" });
    var search = h("input", {
      type: "text", spellcheck: "false", placeholder: "Search tokens…", value: query,
      style: "width:100%;height:24px;border:none;outline:none;background:var(--bg-2);border-radius:5px;padding:0 6px;color:var(--text);margin-bottom:4px"
    });

    cols.forEach(function (col) {
      var vars = dedupeTokens(col.variables.filter(function (v) {
        return v.type === want && (!q || v.name.toLowerCase().indexOf(q) > -1);
      }));

        list.appendChild(h("div", {
          class: "tok-row" + (o.varId === v.id ? " on" : ""),

    var hex = rgb255ToHex(hsvToRgb(hsv));
    var c = hexToRgb255(hex);
    if (document.activeElement !== hexInput) {
      hexInput.value =
        fmtIx === 0 ? hex.slice(1) :
        fmtIx === 1 ? Math.round(c.r) + ", " + Math.round(c.g) + ", " + Math.round(c.b) :
        fmtIx === 2 ? "rgb(" + Math.round(c.r) + " " + Math.round(c.g) + " " + Math.round(c.b) + ")" :
        rgbToHslStr(c);
    }
    if (document.activeElement !== opInput) opInput.value = String(Math.round(currentAlpha() * 100));
  }
  function paintStrip() {
    if (!strip) return;
    strip.innerHTML = "";
    strip.style.background = paintCss({ type: paint.type, stops: paint.stops, transform: paint.transform, opacity: 1 });
    paint.stops.forEach(function (s, i) {
      var g = h("div", {
        class: "gs" + (i === stopIx ? " on" : ""),
        style: "left:" + (s.pos * 100) + "%;background:" + hexAlphaCss(s.color, s.a)
      });
      g.addEventListener("pointerdown", function (e) {
        e.preventDefault(); stop(e);
        stopIx = i;
        hsv = rgbToHsv(hexToRgb255(paint.stops[i].color));
        paintAll();
        var r = strip.getBoundingClientRect();
        g.setPointerCapture(e.pointerId);
        function mv(ev) {
          var pos = Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width));
          paint.stops[i].pos = pos;
          g.style.left = (pos * 100) + "%";
          upd(ctx.prefix + ".gradientStop", { pos: pos }, ctx.index, i, false);
        }
        function up() {
          g.releasePointerCapture(e.pointerId);
          g.removeEventListener("pointermove", mv);
          g.removeEventListener("pointerup", up);
          upd(ctx.prefix + ".gradientStop", { pos: paint.stops[i].pos }, ctx.index, i, true);
        }
        g.addEventListener("pointermove", mv);
        g.addEventListener("pointerup", up);
      });
      strip.appendChild(g);
    });
    strip.addEventListener("dblclick", function (e) {
      var r = strip.getBoundingClientRect();
      var pos = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
      var near = paint.stops[0];
      paint.stops.push({ color: near.color, a: near.a, pos: pos });
      upd(ctx.prefix + ".gradientStop", { pos: pos, color: near.color, a: near.a }, ctx.index, paint.stops.length - 1, true);
      paintStrip();
    });
  }
  function paintLib() {
    libSec.innerHTML = "";
    var q = "";
    var head = h("div", { class: "h" }, [
      h("span", { html: I.style, style: "width:12px" }),
      h("span", { class: "t", text: "Styles & colour tokens" })
    ]);
    libSec.appendChild(head);
    var search = h("input", {
      type: "text", spellcheck: "false", placeholder: "Search…",
      style: "width:100%;height:24px;border:none;outline:none;background:var(--bg-2);border-radius:5px;padding:0 6px;color:var(--text);margin-bottom:4px"
    });
    libSec.appendChild(search);
    var list = h("div", { class: "tok-list" });
    libSec.appendChild(list);

    function fillList() {
      list.innerHTML = "";
      q = search.value.trim().toLowerCase();
      if (!ctx.solidOnly) {
        styleGroups("paint").forEach(function (grp) {
          var styles = grp.items.filter(function (s) { return !q || s.name.toLowerCase().indexOf(q) > -1; });
          if (!styles.length) return;
          list.appendChild(h("div", { class: "mgroup", text: grp.label }));
          styles.slice(0, 200).forEach(function (s) {
            list.appendChild(h("div", {
              class: "tok-row" + (ctx.styleId === s.id ? " on" : ""), title: s.name,
              onclick: function () { popClose(); upd("style." + ctx.prefix, s.id); }
            }, [
              h("span", { class: "sw sm" }, [h("i", { style: "background:" + (s.color || "var(--bg-3)") })]),
              h("span", { class: "nm", text: s.name })
            ]));
          });
        });
      }
      var cols = listOf(ST.variables).concat(listOf(ST.libVariables));
      cols.forEach(function (col) {
        var vars = dedupeTokens(col.variables.filter(function (v) {
          return v.type === "COLOR" && (!q || v.name.toLowerCase().indexOf(q) > -1);
        }));
        if (!vars.length) return;
        list.appendChild(h("div", { class: "mgroup", text: col.name + (col.remote ? "  ·  " + (col.library || "library") : "") }));
        vars.slice(0, 200).forEach(function (v) {
          var mode = col.defaultModeId && v.byMode ? v.byMode[col.defaultModeId] : null;
          list.appendChild(h("div", {
            class: "tok-row" + (paint.colorVar === v.id ? " on" : ""), title: v.name,
            onclick: function () {
              popClose();
              send({ type: "bindVariable", field: ctx.prefix, variableId: v.id, index: ctx.index, sub: isGrad ? stopIx : null });
            }
          }, [
            h("span", { class: "sw sm" }, [h("i", { style: "background:" + (mode && mode.color ? hexAlphaCss(mode.color, mode.alpha) : "var(--bg-3)") })]),
            h("span", { class: "nm", text: v.name }),
            h("span", { class: "val", text: mode ? (mode.color || "") : "" })
          ]));
        });
      });
      if (!list.children.length) {
        list.appendChild(h("div", { class: "hint", style: "padding:4px", text: ST.styles === "loading" ? "Loading…" : "No matching styles or tokens" }));
      }
      if (!ctx.solidOnly) list.appendChild(libScanRow());
    }
    search.addEventListener("input", fillList);
    fillList();

    if (ST.recent.length) {
      var rec = h("div", { class: "cp-sec", style: "border:none;padding:8px 0 0" }, [
        h("div", { class: "h" }, [h("span", { class: "t", text: "Recent" })])
      ]);
      var sw = h("div", { class: "swatches" });
      ST.recent.slice(0, 12).forEach(function (hex) {
        sw.appendChild(h("div", {
          class: "sw", title: hex,
          onclick: function () { setHex(hex, false); }
        }, [h("i", { style: "background:" + hex })]));
      });
      rec.appendChild(sw);
      libSec.appendChild(rec);
    }
  }

  function setHex(hex, live) {
    var n = normHex(hex);
    if (!n) return;
    hsv = rgbToHsv(hexToRgb255(n));
    if (isGrad) paint.stops[stopIx].color = n; else paint.color = n;
    paintSquare(); paintFields(); paintStrip();
    pushColor(n, live);
    if (!live) rememberColor(n);
  }
  function setAlpha(a, live) {
    a = Math.max(0, Math.min(1, a));
    if (isGrad) paint.stops[stopIx].a = a; else paint.opacity = a;
    paintSquare(); paintFields();
    pushAlpha(a, live);
  }

  /* ---- interactions ---- */
  dragArea(sv, function (fx, fy, live) {
    hsv.s = fx; hsv.v = 1 - fy;
    setHex(rgb255ToHex(hsvToRgb(hsv)), live);
  });
  dragArea(hue, function (fx, fy, live) {
    hsv.h = fx * 360;
    setHex(rgb255ToHex(hsvToRgb(hsv)), live);
  });
  dragArea(alphaSl, function (fx, fy, live) { setAlpha(fx, live); });

  hexInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); applyHexInput(); hexInput.blur(); }
  });
  hexInput.addEventListener("blur", applyHexInput);
  function applyHexInput() {
    var raw = hexInput.value.trim();
    var hex = normHex(raw);
    if (!hex) {
      var nums = raw.match(/\d+(\.\d+)?/g);
      if (nums && nums.length >= 3) hex = rgb255ToHex({ r: +nums[0], g: +nums[1], b: +nums[2] });
    }
    if (hex) setHex(hex, false); else paintFields();
  }
  opInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); opInput.blur(); }
  });
  opInput.addEventListener("blur", function () {
    var v = evalExpr(opInput.value);
    if (!isNaN(v)) setAlpha(v / 100, false); else paintFields();
  });

  if (isGrad) {
    body.addEventListener("keydown", function (e) {
      if ((e.key === "Backspace" || e.key === "Delete") && paint.stops.length > 2 &&
          e.target === body) {
        popClose();
      }
    });
  }

  var pop = popOpen(anchor, body, { width: 240, align: "right", class: "cp" });
  paintAll();
  POP.refresh = paintLib;
  return pop;
}

function rememberColor(hex) {
  ST.recent = [hex].concat(ST.recent.filter(function (x) { return x !== hex; })).slice(0, 24);
}

// Normalised pointer dragging inside a box: cb(fx, fy, isLive)
function dragArea(el, cb) {
  el.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    el.setPointerCapture(e.pointerId);
    var r = el.getBoundingClientRect();
    function at(ev, live) {
      cb(
        Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width)),
        Math.max(0, Math.min(1, (ev.clientY - r.top) / r.height)),
        live
      );
    }
    at(e, true);
    function mv(ev) { at(ev, true); }
    function up(ev) {
      el.releasePointerCapture(e.pointerId);
      el.removeEventListener("pointermove", mv);
      el.removeEventListener("pointerup", up);
      at(ev, false);
    }
    el.addEventListener("pointermove", mv);
    el.addEventListener("pointerup", up);
  });
}

        ]));

/* =============================================================================
   Layers panel
   ========================================================================== */

var treeEl = $("tree");
var INDENT = 14;

function rowIndex(id) {
  for (var i = 0; i < ST.rows.length; i++) if (ST.rows[i].id === id) return i;
  return -1;
}

// Rows below a selected layer get a faint wash, so the selection's subtree
// reads as one block — the same cue Figma gives.
function markSubtrees() {
  var sel = {};
  ST.selIds.forEach(function (id) { sel[id] = true; });
  var stack = [];
  ST.rows.forEach(function (r) {
    while (stack.length && r.depth <= stack[stack.length - 1]) stack.pop();
    r.inSelection = stack.length > 0;
    if (sel[r.id]) stack.push(r.depth);
  });
}

function renderTree() {
  if (ST.renaming || ST.dragging) return;
  var scroll = treeEl.scrollTop;
  treeEl.innerHTML = "";

  if (!ST.rows.length) {
    treeEl.appendChild(h("div", { class: "tree-note", text: ST.searching ? "No layers match" : "This page is empty" }));
    return;
  }

  markSubtrees();
  var f = document.createDocumentFragment();
  ST.rows.forEach(function (r, i) { f.appendChild(layerRow(r, i)); });
  treeEl.appendChild(f);

  if (ST.truncated) {
    treeEl.appendChild(h("div", {
      class: "tree-note",
      text: ST.searching ? "Showing the first 500 matches" : "Showing the first 4000 rows — collapse a branch to see more"
    }));
  }
  treeEl.scrollTop = scroll;
}

function layerRow(r, i) {
  var sel = ST.selIds.indexOf(r.id) > -1;
  // A hidden, locked or masking layer keeps its badge visible, so that row needs
  // to reserve the strip on the right; every other row gives it up.
  var hasStick = !r.visible || r.locked || r.mask;
  var el = h("div", {
    class: "lrow" + (sel ? " sel" : "") + (r.visible ? "" : " off") +
      (r.inComponent ? " comp" : "") + (r.type === "SLOT" ? " slot" : "") +
      (r.inSelection && !sel ? " sub" : "") +
      (hasStick ? " has-stick" : ""),
    data: { id: r.id, i: String(i) },
    style: "padding-left:" + (4 + r.depth * INDENT) + "px"
  });

  var caret = h("span", {
    class: "caret" + (r.hasChildren && !ST.searching ? "" : " none"),
    html: r.expanded ? I.caretD : I.caretR
  });
  caret.addEventListener("click", function (e) {
    stop(e);
    send({ type: "setExpanded", id: r.id, expanded: !r.expanded, deep: e.altKey });
  });
  el.appendChild(caret);

  el.appendChild(h("span", { class: "tico", html: typeIcon(r.type, r) }));
  el.appendChild(h("span", { class: "nm", text: r.name }));
  if (r.path) el.appendChild(h("span", { class: "path", text: r.path }));
  // Same layer as one of its own ancestors: the branch would repeat forever, so
  // the plugin stops it here and the row says why instead of just losing its caret.
  if (r.cycle) el.appendChild(h("span", {
    class: "badge", text: "↻",
    title: "This layer already appears further up — the branch repeats itself, so the list stops here"
  }));

  var acts = h("div", { class: "acts" });
  if (r.mask) acts.appendChild(iconBtn(I.clip, { title: "Used as mask", stick: true, plain: true }));
  acts.appendChild(iconBtn(r.visible ? I.eye : I.eyeOff, {
    title: r.visible ? "Hide" : "Show", stick: !r.visible, plain: true,
    onClick: function () { toggleOn(r, "toggleVisible"); }
  }));
  acts.appendChild(iconBtn(r.locked ? I.lock : I.unlock, {
    title: r.locked ? "Unlock" : "Lock", stick: r.locked, plain: true,
    onClick: function () { toggleOn(r, "toggleLock"); }
  }));
  el.appendChild(acts);

  el.addEventListener("pointerdown", function (e) { onRowPointerDown(e, r, i); });
  el.addEventListener("dblclick", function (e) {
    if (e.target.closest(".ib") || e.target.closest(".caret")) return;
    startRename(el, r);
  });
  el.addEventListener("contextmenu", function (e) {
    e.preventDefault();
    if (ST.selIds.indexOf(r.id) === -1) applySelection([r.id], i);
    openLayerMenu(e.clientX, e.clientY, r);
  });
  return el;
}

// Toggling visibility / lock applies to the whole selection when the row is
// part of it — same as Figma.
function toggleOn(r, action) {
  var ids = ST.selIds.indexOf(r.id) > -1 ? ST.selIds : [r.id];
  act(action, ids);
}

function applySelection(ids, anchor) {
  ST.selIds = ids;
  if (anchor != null) ST.anchorIndex = anchor;
  renderTree();
  send({ type: "select", ids: ids });
}

/* ---- pointer: select, then maybe drag ----------------------------------- */

function onRowPointerDown(e, r, i) {
  if (e.button === 2) return;
  if (e.target.closest(".ib") || e.target.closest(".caret") || e.target.closest(".rn")) return;
  treeEl.focus({ preventScroll: true });

  var additive = e.metaKey || e.ctrlKey;
  var range = e.shiftKey;
  var already = ST.selIds.indexOf(r.id) > -1;

  if (range && ST.anchorIndex > -1) {
    var a = Math.min(ST.anchorIndex, i), b = Math.max(ST.anchorIndex, i);
    var ids = ST.rows.slice(a, b + 1).map(function (x) { return x.id; });
    applySelection(ids);
  } else if (additive) {
    var next = already
      ? ST.selIds.filter(function (x) { return x !== r.id; })
      : ST.selIds.concat([r.id]);
    applySelection(next, i);
  } else if (!already) {
    applySelection([r.id], i);
  } else {
    ST.anchorIndex = i;
  }

  beginDragWatch(e, r);
}

/* ---- drag & drop reorder / reparent ------------------------------------- */

function beginDragWatch(e, r) {
  if (ST.searching) return;
  var startX = e.clientX, startY = e.clientY;
  var started = false;
  var lineEl = null, boxEl = null, plan = null;

  function move(ev) {
    if (!started) {
      if (Math.abs(ev.clientY - startY) < 4 && Math.abs(ev.clientX - startX) < 4) return;
      started = true;
      ST.dragging = true;
      document.body.style.cursor = "grabbing";
      lineEl = h("div", { id: "drop-line" });
      boxEl = h("div", { id: "drop-box" });
      treeEl.appendChild(lineEl);
      treeEl.appendChild(boxEl);
    }
    plan = computeDrop(ev.clientY);
    paintDropHint(lineEl, boxEl, plan);
    autoScrollTree(ev.clientY);
  }
  function up() {
    window.removeEventListener("pointermove", move);
    window.removeEventListener("pointerup", up);
    document.body.style.cursor = "";
    if (started) {
      if (lineEl) lineEl.remove();
      if (boxEl) boxEl.remove();
      ST.dragging = false;
      if (plan && ST.selIds.indexOf(plan.targetId) === -1) {
        send({ type: "move", ids: ST.selIds, targetId: plan.targetId, pos: plan.pos });
      } else {
        renderTree();
      }
    }
  }
  window.addEventListener("pointermove", move);
  window.addEventListener("pointerup", up);
}

// Top / bottom quarter of a row means "reorder next to it"; the middle of a
// container means "drop inside".
function computeDrop(clientY) {
  var rows = treeEl.querySelectorAll(".lrow");
  for (var i = 0; i < rows.length; i++) {
    var el = rows[i];
    var b = el.getBoundingClientRect();
    if (clientY < b.top || clientY > b.bottom) continue;
    var rel = (clientY - b.top) / b.height;
    var rec = ST.rows[Number(el.dataset.i)];
    if (!rec) return null;
    var container = rec.hasChildren || CAN_CONTAIN[rec.type];
    if (container && rel > 0.28 && rel < 0.72) return { targetId: rec.id, pos: "inside", el: el };
    return { targetId: rec.id, pos: rel < 0.5 ? "above" : "below", el: el };
  }
  return null;
}
var CAN_CONTAIN = { FRAME: 1, GROUP: 1, COMPONENT: 1, COMPONENT_SET: 1, SECTION: 1, SLOT: 1 };

function paintDropHint(lineEl, boxEl, plan) {
  if (!lineEl || !boxEl) return;
  if (!plan) { lineEl.style.display = "none"; boxEl.style.display = "none"; return; }
  var b = plan.el.getBoundingClientRect();
  var t = treeEl.getBoundingClientRect();
  var top = b.top - t.top + treeEl.scrollTop;
  // The tree scrolls horizontally, so keep the hint inside the visible column.
  var left = treeEl.scrollLeft;
  var width = treeEl.clientWidth;
  if (plan.pos === "inside") {
    lineEl.style.display = "none";
    boxEl.style.display = "block";
    boxEl.style.left = left + "px";
    boxEl.style.width = width + "px";
    boxEl.style.top = top + "px";
    boxEl.style.height = b.height + "px";
  } else {
    boxEl.style.display = "none";
    lineEl.style.display = "block";
    lineEl.style.left = left + "px";
    lineEl.style.width = width + "px";
    lineEl.style.top = (plan.pos === "above" ? top : top + b.height - 2) + "px";
  }
}

function autoScrollTree(clientY) {
  var b = treeEl.getBoundingClientRect();
  if (clientY < b.top + 20) treeEl.scrollTop -= 8;
  else if (clientY > b.bottom - 20) treeEl.scrollTop += 8;
}

/* ---- inline rename ------------------------------------------------------ */

function startRename(rowEl, r) {
  if (ST.renaming) return;
  ST.renaming = r.id;
  var nameEl = rowEl.querySelector(".nm");
  var input = h("input", { class: "rn", type: "text", value: r.name, spellcheck: "false" });
  nameEl.replaceWith(input);
  input.focus();
  input.select();
  var done = false;
  function finish(save) {
    if (done) return;
    done = true;
    ST.renaming = null;
    var v = input.value.trim();
    if (save && v && v !== r.name) send({ type: "rename", id: r.id, name: v });
    else renderTree();
  }
  input.addEventListener("keydown", function (e) {
    stop(e);
    if (e.key === "Enter") { e.preventDefault(); finish(true); }
    else if (e.key === "Escape") { e.preventDefault(); finish(false); }
  });
  input.addEventListener("blur", function () { finish(true); });
}

    { label: "Frame selection", kbd: "⌥⌘G", run: function () { act("frame"); } },
    "-",
    { group: "Order" },
    { label: "Bring to front", kbd: "⌥⌘]", run: function () { act("bringFront"); } },
    { label: "Bring forward", kbd: "⌘]", run: function () { act("forward"); } },
    { label: "Send backward", kbd: "⌘[", run: function () { act("backward"); } },

/* ---- keyboard ----------------------------------------------------------- */

treeEl.addEventListener("keydown", function (e) {
  if (ST.renaming) return;
  var mod = e.metaKey || e.ctrlKey;
  var cur = ST.selIds.length ? rowIndex(ST.selIds[ST.selIds.length - 1]) : -1;

  function moveTo(i, extend) {
    if (i < 0 || i >= ST.rows.length) return;
    var id = ST.rows[i].id;
    if (extend && ST.anchorIndex > -1) {
      var a = Math.min(ST.anchorIndex, i), b = Math.max(ST.anchorIndex, i);
      applySelection(ST.rows.slice(a, b + 1).map(function (x) { return x.id; }));
    } else {
      applySelection([id], i);
    }
    var el = treeEl.querySelector('.lrow[data-id="' + id + '"]');
    if (el) el.scrollIntoView({ block: "nearest", inline: "nearest" });
  }

  if (e.key === "ArrowDown") { e.preventDefault(); moveTo(cur + 1, e.shiftKey); return; }
  if (e.key === "ArrowUp") { e.preventDefault(); moveTo(cur - 1, e.shiftKey); return; }
  if (e.key === "ArrowRight") {
    e.preventDefault();
    var r = ST.rows[cur];
    if (r && r.hasChildren && !r.expanded) send({ type: "setExpanded", id: r.id, expanded: true, deep: e.altKey });
    else moveTo(cur + 1);
    return;
  }
  if (e.key === "ArrowLeft") {
    e.preventDefault();
    var rl = ST.rows[cur];
    if (rl && rl.hasChildren && rl.expanded) send({ type: "setExpanded", id: rl.id, expanded: false, deep: e.altKey });
    else if (rl && rl.parentId) {
      var pi = rowIndex(rl.parentId);
      if (pi > -1) moveTo(pi);
    }
    return;
  }
  if (e.key === "Enter") {
    e.preventDefault();
    var re = ST.rows[cur];
    var el = re && treeEl.querySelector('.lrow[data-id="' + re.id + '"]');
    if (el) startRename(el, re);
    return;
  }
  if (e.key === "Backspace" || e.key === "Delete") { e.preventDefault(); act("delete"); return; }
  if (mod && e.key.toLowerCase() === "d") { e.preventDefault(); act("duplicate"); return; }
  if (mod && e.key.toLowerCase() === "g") {
    e.preventDefault();
    act(e.shiftKey ? "ungroup" : "group");
    return;
  }
  if (mod && e.shiftKey && e.key.toLowerCase() === "h") { e.preventDefault(); act("toggleVisible"); return; }
  if (mod && e.shiftKey && e.key.toLowerCase() === "l") { e.preventDefault(); act("toggleLock"); return; }
  if (mod && e.key === "e") { e.preventDefault(); act("flatten"); return; }
});

/* ---- render entry ------------------------------------------------------- */

function render() { renderTree(); renderInspector(); }

function renderInspector() {
  // Rendering is deferred while a popover is open so the document changing
  // underneath cannot yank a control out from under the pointer. But if the
  // popover is only open on paper — its layer is not on screen, which happens
  // when a click lands on the canvas outside this iframe — deferring forever
  // would freeze the panel. Treat that as closed and carry on.
  if (popIsOpen() && !$("pop-layer").classList.contains("on")) {
    POP.el = null; POP.onClose = null; POP.refresh = null;
  }
  if (popIsOpen()) { pendingRender = true; return; }
  var scroll = inspEl.scrollTop;
  var focusKey = null, caret = null;
  var ae = document.activeElement;
  if (ae && ae.tagName === "INPUT" && inspEl.contains(ae)) {
    var fld = ae.closest("[data-key]");
    if (fld) { focusKey = fld.dataset.key; caret = ae.selectionStart; }
  }

  inspEl.innerHTML = "";
  if (ST.tab === "tokens") renderTokens();
  else if (ST.tab === "prototype") renderPrototype();
  else renderDesign();

  inspEl.scrollTop = scroll;
  if (focusKey) {
    var back = inspEl.querySelector('[data-key="' + focusKey + '"] input');
    if (back) { back.focus(); try { back.setSelectionRange(caret, caret); } catch (e) {} }
  }
}

function renderDesign() {
  var P = ST.P;
  if (!P) {
    inspEl.appendChild(h("div", { id: "insp-empty" }, [
      h("div", { text: "Nothing selected" }),
      h("div", { class: "hint", style: "margin-top:4px", text: "Pick a layer on the canvas or in the list" })
    ]));
    return;
  }
  var f = document.createDocumentFragment();
  f.appendChild(nodeHeader());
  if (ST.count > 1 && ST.colors && ST.colors.length) f.appendChild(selectionColorsSection().wrap);
  if (P.type === "INSTANCE" || isMix(P.type)) { var i = instanceSection(); if (i) f.appendChild(i.wrap); }
  if (P.componentInfo) f.appendChild(componentSection().wrap);
  f.appendChild(positionSection().wrap);
  f.appendChild(layoutSection().wrap);
  f.appendChild(appearanceSection().wrap);
  if (P.text) f.appendChild(typographySection().wrap);
  if (has(P.fills)) f.appendChild(paintSection("fill").wrap);
  if (has(P.strokes)) f.appendChild(paintSection("stroke").wrap);
  if (has(P.effects)) f.appendChild(effectsSection().wrap);
  if (has(P.layoutGrids)) f.appendChild(gridSection().wrap);
  if (P.variableModes) { var vm = variableModesSection(); if (vm) f.appendChild(vm.wrap); }
  if (has(P.exportSettings)) f.appendChild(exportSection().wrap);
  inspEl.appendChild(f);

  if (ST.count > ST.inspected) {
    inspEl.appendChild(h("div", { class: "hint", style: "padding:8px",
      text: "Inspecting the first " + ST.inspected + " of " + ST.count + " selected layers" }));
  }
}

/* ---- labelled group ------------------------------------------------------ */

function grp(label, kids, opts) {
  var o = opts || {};
  return h("div", { class: "grp" }, [
    label ? h("div", { class: "lbl", text: label }) : null,
    h("div", { class: "r " + (o.cls || ""), style: "margin:0" }, [].concat(kids))
  ]);
}

// Labelled pair. Each label travels with its own control, so stacking on a
// narrow panel keeps them together instead of listing both labels first.
// cells: [{ label, control }], trailing: extra nodes kept beside the pair.
function pairGrid(cells, trailing) {
  var pair = h("div", { class: "pair" }, cells.map(function (c) {
    return h("div", { class: "cell" }, [
      c.label ? h("div", { class: "lbl", text: c.label }) : null,
      c.control
    ]);
  }));
  if (!trailing || !trailing.length) return h("div", { class: "grp" }, [pair]);
  return h("div", { class: "grp" }, [
    h("div", { class: "r", style: "margin:0;align-items:flex-end" },
      [h("div", { class: "grow" }, [pair])].concat(trailing))
  ]);
}

/* ---- position ----------------------------------------------------------- */

function positionSection() {
  var P = ST.P;
  var sec = section("Position");
  var absolute = P.layoutPositioning === "ABSOLUTE";

  if (P.inAutoLayout) {
    sec.actions.appendChild(iconBtn(I.target, {

      on: absolute,
      onClick: function () { upd("layoutPositioning", absolute ? "AUTO" : "ABSOLUTE"); }
    }));
  }
  // Figma only offers distribute / tidy once there is more than one layer to
  // arrange, so the header stays at a single icon for a lone selection.
  if (ST.count > 1) {
    sec.actions.appendChild(iconBtn(I.tidy, {
      title: "Distribute and tidy up",
      onClick: function (e) {
        menu(e.currentTarget, [
          { label: "Distribute horizontal spacing", run: function () { upd("distribute", "h"); } },
          { label: "Distribute vertical spacing", run: function () { upd("distribute", "v"); } },
          "-",
          { label: "Tidy up", run: function () { upd("tidy", true); } }
        ], { width: 210, align: "right", noTicks: true });
      }
    }));
  }

  // Alignment: two grouped segmented controls, as in Figma.
  var alignH = h("div", { class: "seg", style: "flex:1 1 0" }, [
    ["left", I.alLeft, "Align left"], ["centerH", I.alCenterH, "Align horizontal centres"],
    ["right", I.alRight, "Align right"]
  ].map(function (a) {

  }));

  }));
  sec.body.appendChild(grp("Alignment", [alignH, alignV]));

  // Inside auto layout Figma still shows X/Y — greyed out, because the parent
  // owns them until you switch the layer to absolute positioning.
  if (has(P.x)) {

    var posTitle = locked ? "Controlled by the parent's auto layout" : "";
    sec.body.appendChild(grp("Position", [

/* ---- layout ------------------------------------------------------------- */

var SIZING_ITEMS = [
  { v: "FIXED", label: "Fixed", icon: I.fixed },
  { v: "HUG", label: "Hug contents", icon: I.hug },
  { v: "FILL", label: "Fill container", icon: I.fill }
];

function layoutSection() {
  var P = ST.P;
  var auto = P.layout;
  var sec = section(auto ? "Auto layout" : "Layout");

  /* Adding auto layout lives in the header; removing it is the "none" option of
     the Flow control, which is why the header has no icon once it is on. */
  if (has(P.layoutMode) && !auto) {
    sec.actions.appendChild(iconBtn(I.plus, {
      title: "Add auto layout", stick: true,
      onClick: function () { upd("layoutMode", "VERTICAL"); }
    }));
  }

  if (auto) {
    sec.body.appendChild(grp("Flow", [
      seg([
        { v: "NONE", icon: I.layoutNone, title: "No auto layout" },
        { v: "VERTICAL", icon: I.layoutV, title: "Vertical flow" },
        { v: "HORIZONTAL", icon: I.layoutH, title: "Horizontal flow" },
        { v: "GRID", icon: I.layoutGrid, title: "Grid" }
      ], auto.mode, function (v) { upd("layoutMode", v); })
    ]));
  }

  /* text auto-resize sits in Layout under its own "Resizing" label */
  if (P.text) {
    sec.body.appendChild(grp("Resizing", [
      seg([
        { v: "WIDTH_AND_HEIGHT", icon: I.hug, title: "Auto width" },
        { v: "HEIGHT", icon: I.fixed, title: "Auto height" },
        { v: "NONE", icon: I.truncate, title: "Fixed size" }
      ], P.text.textAutoResize, function (v) { upd("textAutoResize", v); })
    ]));
  }

  /* size + resizing */
  if (has(P.width)) {
    var canHug = P.childCount > 0 || P.type === "TEXT" || !!auto;
    // All three modes stay listed; the inapplicable ones are greyed out rather
    // than hidden, so the menu never changes shape under you.
    var sizingItems = SIZING_ITEMS.map(function (s) {
      var off = (s.v === "HUG" && !canHug) || (s.v === "FILL" && !P.inAutoLayout);
      return { v: s.v, label: s.label, icon: s.icon, disabled: off };
    });
    var wFixed = P.layoutSizingHorizontal === "FIXED" || P.layoutSizingHorizontal == null;
    var hFixed = P.layoutSizingVertical === "FIXED" || P.layoutSizingVertical == null;
    var modeLabel = function (m) { return m === "HUG" ? "Hug" : (m === "FILL" ? "Fill" : null); };

    // The sizing mode rides inside the W/H field as a trailing label, and the
    // label itself is the menu trigger — exactly how Figma packs this row.
    function sizeField(axis) {
      var horiz = axis === "h";
      var mode = horiz ? P.layoutSizingHorizontal : P.layoutSizingVertical;
      var fixed = horiz ? wFixed : hFixed;
      var label = modeLabel(mode);
      var tail = [];
      if (has(mode)) {
        // Hug / Fill name themselves in the field; Fixed shows just a chevron,
        // so the number keeps the space.
        tail.push(h("button", {
          class: "ib stick",
          style: label ? "width:auto;padding:0 6px;color:var(--text)" : "min-width:16px;padding:0",
          text: label || null, html: label ? null : I.chevD,
          title: "Resizing",
          onclick: function (e) { stop(e); openSizingMenu(e.currentTarget, axis, sizingItems); }
        }));
      }
      return field({
        icon: horiz ? I.w : I.hh,
        // Figma keeps showing the resolved number next to Fill / Hug.
        value: horiz ? P.width : P.height,
        disabled: !fixed, plate: true, min: 0.01,
        onChange: function (v, live) { upd(horiz ? "width" : "height", v, null, null, !live); },
        varId: bv(horiz ? "width" : "height"), bindField: horiz ? "width" : "height",
        hideTokenButton: true,
        title: horiz ? "Width" : "Height", dataKey: horiz ? "w" : "h",
        tail: tail
      });
    }

    sec.body.appendChild(grp("Resizing", [
      sizeField("h"), sizeField("v"),
      iconBtn(I.fitContent, {
        title: "Advanced layout — min / max size, wrap, canvas stacking",
        onClick: function (e) { openAdvancedLayout(e.currentTarget); }
      })
    ]));
  }

  /* Alignment pad and Gap sit side by side, each under its own label. */
  if (auto) {
    var gapAdv = iconBtn(I.typeDetails, {
      title: "Spacing details",
      onClick: function (e) { openAdvancedLayout(e.currentTarget); }
    });
    sec.body.appendChild(h("div", { class: "r grp", style: "align-items:flex-start" }, [
      h("div", { style: "flex:0 0 auto" }, [
        h("div", { class: "lbl", text: "Alignment" }),
        alignPad(auto)
      ]),
      h("div", { class: "grow" }, [
        h("div", { class: "lbl", text: "Gap" }),
        h("div", { class: "r", style: "margin:0" }, [gapField(auto), gapAdv])
      ])
    ]));

    if (auto.mode === "GRID") {
      sec.body.appendChild(grp("Grid", [
        field({ iconText: "R", value: auto.gridRowCount, min: 1,
          onChange: function (v) { upd("gridRowCount", Math.round(v)); }, title: "Rows", dataKey: "gridRows" }),
        field({ iconText: "C", value: auto.gridColumnCount, min: 1,
          onChange: function (v) { upd("gridColumnCount", Math.round(v)); }, title: "Columns", dataKey: "gridCols" })
      ], { cls: "g2" }));
    }

    sec.body.appendChild(grp("Padding", [paddingRow(auto)]));
  }

  // Only "Clip content" stays inline; canvas stacking and stroke handling sit
  // behind the advanced button, as they do in Figma.
  if (has(P.clipsContent)) {
    sec.body.appendChild(h("div", { class: "grp" },
      [chk("Clip content", P.clipsContent, function (v) { upd("clipsContent", v); })]));

// Figma's 3x3 alignment pad: columns map to one axis, rows to the other,

function alignPad(auto) {

  for (var rI = 0; rI < 3; rI++) {

      var counter = horiz ? AX[rI] : AX[cI];
      var on = spread
        ? auto.counterAxisAlignItems === counter

      pad.appendChild(h("div", {

          return function () {

            upd("counterAxisAlignItems", c, null, null, true);

        })(primary, counter)

    }
  }
  return pad;

// Line height / letter spacing accept "24", "120%" or "auto" — the unit rides
// along with the value, exactly like Figma's fields.
function unitField(lu, key, title, glyph, allowAuto) {
  var isAuto = lu.unit === "AUTO";
  var mixedUnit = lu.unit === MIXED;
  var shown = isAuto || mixedUnit ? "" : fmt(lu.value) + (lu.unit === "PERCENT" ? "%" : "");
  return field({
    iconText: glyph, text: shown,
    placeholder: mixedUnit ? "Mixed" : (isAuto ? "Auto" : ""),
    title: title + (allowAuto ? "  ·  type “auto” to reset" : ""),
    dataKey: key,
    onChange: function (raw) {
      var s = String(raw).trim().toLowerCase();
      if (!s || s === "auto") {
        if (allowAuto) upd(key, null);
        else upd(key, 0, null, "PIXELS");
        return;
      }
      var percent = s.indexOf("%") > -1;
      var v = evalExpr(s.replace("%", ""));
      if (isNaN(v)) { render(); return; }
      upd(key, v, null, percent ? "PERCENT" : "PIXELS");
    }
  });
}

function openTextStylePicker(anchor) {
  ensureStyles();
  var query = "";

  function build() {
    var body = h("div", { class: "pop-body" });
    var search = h("input", {
      type: "text", spellcheck: "false", placeholder: "Search text styles…", value: query,
      style: "width:100%;height:24px;border:none;outline:none;background:var(--bg-2);border-radius:5px;padding:0 6px;color:var(--text);margin-bottom:4px"
    });
    search.addEventListener("input", function () { query = search.value; repaint(); });
    body.appendChild(search);

    var list = h("div", { class: "tok-list", style: "max-height:300px" });
    var q = query.trim().toLowerCase();
    var groups = styleGroups("text");
    var any = 0;
    groups.forEach(function (grp) {
      var items = grp.items.filter(function (s) { return !q || s.name.toLowerCase().indexOf(q) > -1; });
      if (!items.length) return;
      list.appendChild(h("div", { class: "mgroup", text: grp.label }));
      items.slice(0, 300).forEach(function (s) {
        any++;
        list.appendChild(h("div", {
          class: "tok-row" + (ST.P.textStyleId === s.id ? " on" : ""), title: s.name,
          onclick: function () { popClose(); upd("style.text", s.id); }
        }, [
          h("span", { html: I.style, style: "width:14px;color:" + (grp.remote ? "var(--brand)" : "var(--icon-2)") }),
          h("span", { class: "nm", text: s.name }),
          h("span", { class: "val", text: s.desc })
        ]));
      });
    });
    if (!any) {
      list.appendChild(h("div", { class: "hint", style: "padding:6px",
        text: ST.styles === "loading" ? "Loading…" : (q ? "No matching text style" : "No text styles found yet") }));
    }
    body.appendChild(list);
    if (ST.P.textStyleId) {
      body.appendChild(h("div", { class: "msep" }));
      body.appendChild(h("div", {
        class: "mi", onclick: function () { popClose(); upd("style.text", ""); }
      }, [h("span", { class: "tick", html: I.detach }), h("span", { class: "t", text: "Detach text style" })]));
    }
    body.appendChild(libScanRow());
    return body;
  }

  popOpen(anchor, build(), { width: 260, align: "right" });
  function repaint() {
    if (!POP.el) return;

// A property key is "Label#<sessionId>:<localId>"; the local id increments as
// properties are created, so it approximates the authored order when the
// definition list is unavailable.
function propKeyRank(key) {
  var m = /#(\d+):(\d+)/.exec(String(key || ""));
  return m ? [parseInt(m[1], 10), parseInt(m[2], 10)] : null;
}

/*
  Figma's property order, reproduced:
    · variant properties first;
    · then the order the component declares them in (propertyOrder), because the
      instance's own componentProperties object is unordered;
    · a swap property sits directly under the boolean that reveals it, marked "↳".
*/
function orderInstanceProps(props, order) {
  var rank = {};
  (order || []).forEach(function (key, i) { rank[key] = i; });

  var sorted = props.slice().sort(function (a, b) {
    var av = a.type === "VARIANT" ? 0 : 1;
    var bv = b.type === "VARIANT" ? 0 : 1;
    if (av !== bv) return av - bv;

    var ar = rank[a.key], br = rank[b.key];
    if (ar !== undefined && br !== undefined) return ar - br;
    if (ar !== undefined) return -1;
    if (br !== undefined) return 1;

    var ak = propKeyRank(a.key), bk = propKeyRank(b.key);
    if (ak && bk) {
      if (ak[0] !== bk[0]) return ak[0] - bk[0];
      if (ak[1] !== bk[1]) return ak[1] - bk[1];
    }
    return naturalCompare(a.label, b.label);
  });

  var out = [];
  var used = {};
  sorted.forEach(function (pr, i) {
    if (used[i]) return;
    used[i] = true;
    out.push(pr);
    if (pr.type !== "BOOLEAN") return;
    sorted.forEach(function (other, j) {
      if (used[j] || other.type !== "INSTANCE_SWAP" || other.label !== pr.label) return;
      used[j] = true;
      out.push(other);
    });
  });
  return out;
}

/* Component picker for an instance-swap property (propKey) or for swapping the

  ST.swapOptions = null;

  var query = "";

  function build() {
    var body = h("div", { class: "pop-body" });
    var search = h("input", {
      type: "text", spellcheck: "false", placeholder: "Search components…", value: query,
      style: "width:100%;height:24px;border:none;outline:none;background:var(--bg-2);border-radius:5px;padding:0 6px;color:var(--text);margin-bottom:4px"
    });
    search.addEventListener("input", function () { query = search.value; repaint(); });
    body.appendChild(search);

    var list = h("div", { class: "tok-list", style: "max-height:300px" });
    var data = ST.swapOptions;
    if (!data) {
      list.appendChild(h("div", { class: "hint", style: "padding:6px", text: "Loading components…" }));
    } else {
      var q = query.trim().toLowerCase();
      var groups = [["Preferred", data.preferred], ["In this page", data.local]];
      var any = 0;
      groups.forEach(function (g) {
        var items = dedupe((g[1] || []).filter(function (c) {
          return !q || c.name.toLowerCase().indexOf(q) > -1 || (c.set || "").toLowerCase().indexOf(q) > -1;
        }), function (c) { return c.id; }, function (c) { return (c.set || "") + "/" + c.name; });
        if (!items.length) return;
        list.appendChild(h("div", { class: "mgroup", text: g[0] }));
        items.slice(0, 300).forEach(function (c) {
          any++;
          list.appendChild(h("div", {
            class: "tok-row", title: (c.set ? c.set + " / " : "") + c.name,
            onclick: function () {
              popClose();
              if (propKey) upd("instanceProp", c.id, null, propKey);
              else send({ type: "swapInstance", componentId: c.id });
            }
          }, [
            h("span", { html: typeIcon("COMPONENT"), style: "width:14px;color:var(--text-comp)" }),
            h("span", { class: "nm", text: c.name }),
            h("span", { class: "val", text: c.set || "" })
          ]));
        });
      });
      if (!any) {
        list.appendChild(h("div", { class: "hint", style: "padding:6px",
          text: q ? "No matching component" : "No components found on this page" }));
      }
    }
    body.appendChild(list);
    return body;
  }

  popOpen(anchor, build(), { width: 260, align: "right" });
  function repaint() {
    if (!POP.el) return;
    POP.el.innerHTML = "";
    POP.el.appendChild(build());
    var s = POP.el.querySelector("input");
    if (s) { s.focus(); s.setSelectionRange(query.length, query.length); }
  }
  POP.refresh = repaint;
}
